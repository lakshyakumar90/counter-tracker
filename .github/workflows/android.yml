name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository history for exposed secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve and lock Android dependencies
        run: |
          bash ./gradlew --no-daemon :app:dependencies --configuration debugRuntimeClasspath --write-locks
          bash ./gradlew --no-daemon :app:dependencies --configuration debugAndroidTestRuntimeClasspath --write-locks
          bash ./gradlew --no-daemon :app:dependencies --configuration releaseRuntimeClasspath --write-locks

      - name: Scan locked dependencies for known vulnerabilities
        uses: google/osv-scanner-action/osv-scanner-action@0e457b42d0120153c352875e9b758b1e5c58c7e5 # v2.7.1
        with:
          scan-args: |-
            --recursive
            --lockfile=app/gradle.lockfile

      - name: Build and run checks
        run: >-
          bash ./gradlew --no-daemon
          :app:assembleDebug
          :app:assembleDebugAndroidTest
          :app:testDebugUnitTest
          :app:lintDebug
          checkFormatting
