      <text x="18" y="560" font-size="11" fill="#52696D">HOME   RECORD   MAPS   INSIGHTS</text><text x="20" y="584" font-size="10" fill="#52696D">Plan appears only if approved for V1</text>
      <text x="20" y="635" font-size="18" font-weight="700">01 · Home</text><text x="20" y="658" font-size="12" fill="#52696D">Local summary, one clear next action.</text>
