      <rect x="45" y="330" width="24" height="95" rx="5" fill="#1E6674"/><rect x="91" y="300" width="24" height="125" rx="5" fill="#1E6674"/><rect x="137" y="315" width="24" height="110" rx="5" fill="#1E6674"/><rect x="183" y="270" width="24" height="155" rx="5" fill="#1E6674"/>
      <text x="48" y="450" font-size="11" fill="#52696D">W1</text><text x="94" y="450" font-size="11" fill="#52696D">W2</text><text x="140" y="450" font-size="11" fill="#52696D">W3</text><text x="186" y="450" font-size="11" fill="#52696D">W4</text>
      <text x="20" y="490" font-size="12" fill="#52696D">Select a bar for linked activity</text>
      <text x="20" y="560" font-size="11" fill="#52696D">HOME   RECORD   MAPS   INSIGHTS</text>
      <text x="20" y="635" font-size="18" font-weight="700">05 · Insights</text><text x="20" y="658" font-size="12" fill="#52696D">Accessible selection and data labels.</text>
