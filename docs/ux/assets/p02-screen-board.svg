      <text x="95" y="205" font-family="monospace" font-size="44" font-weight="700">12:48</text><text x="101" y="232" font-size="13" fill="#52696D">elapsed</text>
      <text x="22" y="310" font-family="monospace" font-size="26" font-weight="700">3.42 km</text><text x="24" y="334" font-size="12" fill="#52696D">distance</text>
      <text x="137" y="310" font-family="monospace" font-size="24" font-weight="700">5:42</text><text x="138" y="334" font-size="12" fill="#52696D">avg pace</text>
