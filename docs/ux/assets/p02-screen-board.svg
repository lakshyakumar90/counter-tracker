<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Pace P02 screen board</title>
  <desc id="desc">Five compact-phone screen concepts for Home, Record, Maps, Plan behind a scope gate, and Insights.</desc>
  <rect width="1440" height="900" fill="#F2F5F2"/>
