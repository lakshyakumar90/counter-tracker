:"Kotlin use cases / repositories","r":"Metrics, workout plan rules, session transitions","n":"UI does not write DB directly"},{"l":"Local DB","c":"Room / SQLite","r":"Activities, sample points, workout templates, goals, sync outbox","n":"Phone is source of truth"},{"l":"Settings","c":"Jetpack DataStore","r":"Units, theme, defaults, reminder preferences","n":"No secrets stored as plain prefs"},{"l":"Location","c":"Fused provider + Android fallback","r":"GPS callbacks while recording in foreground service","n":"Phone may lack Google Play Services"},{"l":"Recording","c":"Foreground service of type location","r":"Active capture while screen locked","n":"Must start in a policy-compliant manner"},{"l":"Offline map renderer","c":"MapLibre Native/Compose","r":"Render vector maps, styles, routes, position","n":"Check version/API compatibility"},{"l":"Offline map tiles","c":"Licensed provider or self-hosted package","r":"Downloadable city/region map data","n":"No bulk use of public OSM tile servers"},{"l":"Routes","c":"GPX + local route domain","r":"Import/export and follow recorded paths","n":"No auto turn-by-turn in initial scope"},{"l":"Local analytics","c":"Pure Kotlin math + SQL aggregates","r":"Pace, distance, records, charts, rules","n":"All available in airplane mode"},{"l":"Visualizations","c":"Compose Canvas + chart library if needed","r":"Interactive analytic charts, map-linked tooltips","n":"Accessible chart summaries required"},{"l":"Work scheduling","c":"WorkManager","r":"Background sync/retry and map jobs when appropriate","n":"Not the live GPS recorder"},{"l":"Authentication","c":"Supabase Auth","r":"Email/password, sessions, optional Google OAuth","n":"Offline local account still usable"},{"l":"Cloud relational","c":"Supabase Postgres","r":"Activity summaries, plans, goals, metadata","n":"Enforce RLS on all user tables"},{"l":"Cloud files","c":"Supabase private Storage","r":"Compressed/versioned GPS traces, user exports","n":"Object access policies + separate backups"},{"l":"Sync","c":"Persistent outbox + idempotent upserts","r":"Offline mutations and restore across devices","n":"Tombstones, revisions, conflict policy"},{"l":"Backend API","c":"Supabase Edge Functions","r":"Auth-only actions, AI proxy, admin-safe operations","n":"Keep secret credentials on server"},{"l":"AI vendor","c":"OpenAI Responses API","r":"Training insight and suggested workout after V1","n":"Opt-in and online-only"},{"l":"AI formats","c":"OpenAI Structured Outputs","r":"Typed workout proposal and explanatory insights","n":"Schema validation before display/save"},{"l":"Secrets","c":"Supabase secrets / key management","r":"Store OpenAI key and service secrets","n":"Do not ship secrets in APK"},{"l":"Security","c":"RLS + HTTPS + secure local credentials","r":"Separate user accounts and private GPS routes","n":"Test malicious cross-user access"},{"l":"Quality","c":"JUnit + Compose UI tests + instrumentation","r":"Metrics tests, flows and on-device recording","n":"Physical device testing mandatory"},{"l":"CI/CD","c":"GitHub Actions + Android Gradle","r":"Build, lint, tests and signed release pipeline","n":"Release signing isolated"},{"l":"Distribution","c":"APK + Play AAB","r":"Direct install, internal beta and Play distribution","n":"User does not install Java runtime"},{"l":"Monitoring","c":"Privacy-aware crash/performance tooling","r":"Operational issues and performance without raw GPS logging","n":"Opt-in where required"}],"dec":[{"id":"D01","a":"Android first","c":"Native Kotlin + Compose","r":"Best direct support for GPS/service lifecycle and premium UI","s":"Locked","prop":0},{"id":"D02","a":"Core works offline","c":"Room is canonical local storage","r":"App operates without Supabase or OpenAI response","s":"Locked","prop":0},{"id":"D03","a":"Cloud provider","c":"Supabase Auth + Postgres + private Storage","r":"Simple managed cloud for structured personal fitness data","s":"Locked","prop":0},{"id":"D04","a":"GPS background","c":"Foreground location service","r":"Required for reliable screen-off active recording","s":"Locked","prop":0},{"id":"D05","a":"Offline maps","c":"MapLibre + licensed offline region pack","r":"GPS and map are separate; initial map package limited","s":"Locked","prop":0},{"id":"D06","a":"Initial navigation","c":"View and follow saved routes; no route engine","r":"Turn-by-turn requires separate offline graph/routing work","s":"Locked","prop":0},{"id":"D07","a":"Supported sports","c":"Cycling, Running, Jogging, Walking","r":"Jogging can share run engine while preserving UI type","s":"Locked","prop":0},{"id":"D08","a":"Home workouts","c":"Bodyweight, timer, HIIT, mobility","r":"Not gym-only, not swimming","s":"Locked","prop":0},{"id":"D09","a":"Social features","c":"None in V1","r":"No feeds, leaderboards or community endpoints","s":"Locked","prop":0},{"id":"D10","a":"Subscriptions","c":"None","r":"App features not gated behind billing","s":"Locked","prop":0},{"id":"D11","a":"Performance prediction","c":"Rule/formula before AI","r":"Explain confidence and limitations","s":"Locked","prop":0},{"id":"D12","a":"AI timing","c":"OpenAI integrated after core app release candidate","r":"No AI calls in critical GPS/analytics path","s":"Locked","prop":0},{"id":"D13","a":"AI transport","c":"Device -> Edge Function -> OpenAI","r":"API keys never embedded in mobile binary","s":"Locked","prop":0},{"id":"D14","a":"Sync policy","c":"Outbox + idempotent upserts + conflict rules","r":"Device stores first, syncs eventually, deletes tombstoned","s":"Locked","prop":0},{"id":"D15","a":"Cloud disaster recovery","c":"Back up both Postgres and Storage objects","r":"Database backups alone omit Storage file contents","s":"Locked","prop":0},{"id":"D16","a":"Analytics layout","c":"Interactive charts and linked route scrub","r":"UI differentiator without sacrificing readability","s":"Locked","prop":0},{"id":"D17","a":"First launch offline","c":"Local-only mode + limited packaged map fallback","r":"No promise of full detailed world map in APK","s":"Locked","prop":0},{"id":"D18","a":"Release scope","c":"APK and Play Store AAB","r":"First deliverable is installable offline test build","s":"Locked","prop":0},{"id":"D19","a":"AI vendor cost","c":"Budget caps, quotas, feature flag","r":"No subscription does not imply API calls are free","s":"Locked","prop":0},{"id":"D20","a":"Sensitive data","c":"Private by default, minimum OpenAI payload","r":"No social feed still requires security and consent","s":"Locked","prop":0},{"id":"D21","a":"Sequencing","c":"Auth (P06) moves to just before cloud sync","r":"Core is offline (D02); sign-in is only needed for P17","s":"Proposed","prop":1},{"id":"D22","a":"Sync policy","c":"V1 cloud is backup-first; saved tracks immutable","r":"Avoids bidirectional conflict handling for GPS data; metadata still merges","s":"Proposed","prop":1},{"id":"D23","a":"Platform","c":"targetSdk 36 baseline; track API 37","r":"Google Play target-API requirement since Aug 31, 2026","s":"Proposed","prop":1},{"id":"D24","a":"AI transport","c":"Vendor-neutral AI gateway (amends D13)","r":"Keeps OpenAI as default without hard-wiring it; on-device options evaluated","s":"Proposed","prop":1},{"id":"D25","a":"Quality","c":"Definition of Done applies to every task","r":"Tests, lint, CI, accessibility and strings checked continuously, not only in P19","s":"Proposed","prop":1}],"refs":[{"n":"Android offline-first architecture","u":"https://developer.android.com/topic/architecture/data-layer/offline-first","w":"Room/WorkManager, local data as canonical"},{"n":"Android foreground service types","u":"https://developer.android.com/develop/background-work/services/fgs/service-types","w":"Location service policy and lifecycle"},{"n":"Compose Material 3","u":"https://developer.android.com/develop/ui/compose/designsystems/material3","w":"Native Android UI components and theming"},{"n":"MapLibre offline packs","u":"https://maplibre.org/maplibre-compose/offline/","w":"Offline region/map style resource management"},{"n":"Supabase RLS","u":"https://supabase.com/docs/guides/database/postgres/row-level-security","w":"Protect per-user tables"},{"n":"Supabase Storage access control","u":"https://supabase.com/docs/guides/storage/security/access-control","w":"Protect private GPS uploads"},{"n":"Supabase Edge Functions auth","u":"https://supabase.com/docs/guides/functions/auth","w":"Secure server-side integrations"},{"n":"Supabase Edge Functions secrets","u":"https://supabase.com/docs/guides/functions/secrets","w":"Keep OpenAI key on server"},{"n":"Supabase database backup limitations","u":"https://supabase.com/docs/guides/platform/backups","w":"Database backup does not include Storage files"},{"n":"OpenAI Responses API","u":"https://developers.openai.com/api/reference/resources/responses/methods/create","w":"AI integration endpoint"},{"n":"OpenAI Structured Outputs","u":"https://developers.openai.com/api/docs/guides/structured-outputs","w":"Validate typed workout/insight schema"},{"n":"OpenAI data controls","u":"https://developers.openai.com/api/docs/guides/your-data","w":"Plan retention/storage and user consent"},{"n":"OpenAI production guidance","u":"https://developers.openai.com/api/docs/guides/production-best-practices","w":"Security, rate limits and operations"},{"n":"Google Play target API level requirement","u":"https://support.google.com/googleplay/android-developer/answer/11926878","w":"Target API 36 for new apps and updates"},{"n":"Play testing requirements for new personal accounts","u":"https://support.google.com/googleplay/android-developer/answer/14151465","w":"12 testers, 14 days before production access"},{"n":"Google Play policy announcements","u":"https://developer.android.com/distribute/play-policies","w":"Location permission and developer verification changes"}],"review":[{"id":"F01","sev":"Critical","area":"Sequencing","f":"Dependencies are only “previous phase gate”, and most phases start before that gate can close.","why":"21 of 22 phases start before the phase they depend on ends, so the gate rule cannot be followed as written.","fix":"Use a real phase dependency graph (added: Roadmap tab) and let independent phases overlap on purpose.","st":"Applied"},{"id":"F02","sev":"Critical","area":"Scope","f":"No capacity or velocity assumption behind 607 tasks / 46 weeks for a solo build.","why":"1780 points sit in the original plan (peak week 83 points). You cannot tell if it is feasible until you measure your pace.","fix":"Set a baseline (P00-T101), define the MVP cut line (P00-T102), and use the Dashboard forecast after the first weeks.","st":"Applied"},{"id":"F03","sev":"High","area":"Sequencing","f":"Authentication (P06, W07–W10) is built before GPS recording although the core is offline-first (D02).","why":"Sign-in only matters once cloud backup exists. It delays the riskiest, most valuable work (recording) by four weeks.","fix":"Revised plan moves P06 to W20–W23, just before P17. P04 local profile covers the meantime. Needs your confirmation.","st":"Applied"},{"id":"F04","sev":"High","area":"Duplication","f":"Metrics math is planned twice: GPS engine (P07) and analytics (P11); golden-track fixtures also twice (P11-T028, P19-T001).","why":"Two implementations drift apart; fixtures arriving at W29 are far too late to protect P07.","fix":"Build the P11 metrics library first (W08–W10), make P07 tasks integrations, build golden tracks once (P07-T101).","st":"Applied"},{"id":"F05","sev":"High","area":"Quality","f":"Reliability testing is concentrated in P19 (W29–W35); physical-device testing first appears in W29.","why":"GPS recording on real phones is the product’s make-or-break. Problems found at W30 cost far more than at W10.","fix":"Definition of Done (P00-T103), test devices (P01-T101), replay harness (P07-T101) and a weekly outdoor test.","st":"Applied"},{"id":"F06","sev":"High","area":"Play compliance","f":"Store requirements show up late or not at all.","why":"Google Play requires target API 36 for new apps and updates since Aug 31, 2026; the plan says only “document supported versions”. The precise-location declaration is planned for W37. New personal accounts need a 12-tester, 14-day closed test, and internal testing does not count.","fix":"Added P01-T102, P01-T105, P07-T102, P20-T101, P20-T102 and P20-T103. Check the current Google pages in References before each deadline.","st":"Applied"},{"id":"F07","sev":"High","area":"Cloud sync","f":"P17 (38 tasks, plus many QA cases) implements full bidirectional multi-device sync with conflict handling.","why":"Conflict resolution is the classic solo-developer time sink, and GPS tracks do not need it: they never change after saving.","fix":"Backup-first with a single-writer rule (P17-T101): tracks immutable, only metadata merges. Add live multi-device editing only if users need it.","st":"Needs your decision"},{"id":"F08","sev":"Medium","area":"Operations","f":"Crash monitoring is set up in P22 (W43), after beta (W37) and after the test of its privacy (P19-T039, W35).","why":"You would run the beta blind and test a tool that does not exist yet.","fix":"P22-T002 moved to W32 in the revised plan.","st":"Applied"},{"id":"F09","sev":"Medium","area":"QA","f":"QA-001 to QA-040 are word-for-word copies of P19-T001 to P19-T040.","why":"Two records for one test double the bookkeeping and can disagree.","fix":"QA tab links each test to its P19 task; QA-041 to QA-064 stay separate.","st":"Applied"},{"id":"F10","sev":"Medium","area":"Platform decisions","f":"Several platform decisions are missing: Auto Backup and data extraction, at-rest encryption, reminder mechanism after reboot, string externalization, concrete libraries (DI, Supabase client, charts).","why":"Each is cheap now and expensive to retrofit; Auto Backup could copy private GPS data off the phone by default.","fix":"Added P05-T101, P05-T102, P14-T101, P01-T103, P01-T104.","st":"Applied"},{"id":"F11","sev":"Medium","area":"Privacy","f":"Account deletion is in-app only (P18-T013) and the privacy-law duties are not captured.","why":"Play’s account-deletion rules expect a web deletion path as well, and data-protection laws differ by region.","fix":"Added P18-T101 and P00-T105. Confirm legal points with a professional.","st":"Applied"},{"id":"F12","sev":"Medium","area":"GenAI","f":"OpenAI is hard-wired (D13) and comes after release with no release, disclosure or eligibility step.","why":"The AI phase needs a second Play review, updated disclosures, rules for local-only users, and no offline AI option is evaluated.","fix":"Added P21-T101 to P21-T105 and decision D24. OpenAI stays the default.","st":"Needs your decision"},{"id":"F13","sev":"Medium","area":"External blockers","f":"Map licensing and cost (P08-T001, W10) is decided after P08 starts; Supabase plan limits are assumed.","why":"A licensing surprise could invalidate offline map downloads, a headline feature.","fix":"Revised plan moves P08-T001 and T002 to W05–W06; added P17-T102 to verify plan limits.","st":"Applied"},{"id":"F14","sev":"Low","area":"Labels","f":"Release labels mix concepts: P22 (post-launch) is labelled “Beta & hardening”; P12 insights and P06 auth are “Core MVP”.","why":"Filtering by Release gives misleading cut lines.","fix":"Decide the MVP cut line first (P00-T102), then relabel.","st":"Needs your decision"},{"id":"F15","sev":"Low","area":"Product scope","f":"Calories, steps, heart-rate and Health Connect are neither in scope nor excluded (only evaluated in P22-T016).","why":"Users of fitness apps often expect calories; an explicit non-goal avoids scope creep.","fix":"Add them to the non-goals in P00-T003 or to the V1.1 list.","st":"Needs your decision"}],"tot":1780};

 return `<div class="kp"><div class="card"><b>${tot}</b><span>tasks in this plan</span></div><div class="card"><b>${d}</b><span>done</span></div><div class="card"><b>${pc}%</b><span>of ${pts} points complete</span></div><div class="card"><b>${ip}</b><span>in progress</span></div><div class="card"><b class="${b?'risk':''}">${b}</b><span>blocked</span></div></div>

 return `<div class="sm" style="margin-bottom:6px">${L.length} tests · ${D.qa.filter(x=>R(x)==='Passed').length} passed · ${D.qa.filter(x=>R(x)==='Failed').length} failed · QA-001 to QA-040 are the P19 tasks, tracked here as test results</div><div class="card tw"><table><tr><th>ID</th><th>Scenario</th><th>Pass criteria</th><th>Pri</th><th>Result</th><th>Device and build</th><th>Evidence</th></tr>${L.map(x=>{const u=U.qa[x.id]||{};return `<tr><td>${x.id}${x.link?`<div class="sm">${x.link}</div>`:''}</td><td>${esc(x.sc)}<div class="sm">${esc(x.cat)} · ${esc(x.env)}</div></td><td>${esc(x.pass_)}</td><td>${x.pr}</td><td><select data-a="qr" data-id="${x.id}">${opts(QR,R(x))}</select></td><td><input type="text" data-a="qd" data-id="${x.id}" value="${esc(u.d)}" size="14"></td><td><input type="text" data-a="qe" data-id="${x.id}" value="${esc(u.e)}" size="14"></td></tr>`}).join('')}</table></div>`}
function vQA(){const f=F.qa;return `<div class="fb"><select data-a="f" data-k="qa.p">${popts(f.p,'All phases')}</select><select data-a="f" data-k="qa.r">${opts(QR,f.r,'All results')}</select><input type="search" data-a="q" data-k="qa" placeholder="Search tests" value="${esc(f.q)}"></div><div id="ql">${qlist()}</div>`}
function vReview(){const f=F.rv,cls={Critical:'crit',High:'high',Medium:'med',Low:'low'},L=D.review.filter(r=>!f.sev||r.sev===f.sev);
 return `<p style="margin-top:0;max-width:70ch">${D.review.length} findings from reviewing the original plan. “Applied” means the change is already in the revised plan; “Needs your decision” means the plan can go either way. Policy facts were checked against Google’s pages in November 2026, so recheck them before each deadline.</p>
 <div class="fb"><select data-a="f" data-k="rv.sev">${opts(['Critical','High','Medium','Low'],f.sev,'All severities')}</select></div>
 ${L.map(r=>`<div class="card" style="margin-bottom:10px"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="tag ${cls[r.sev]}">${r.sev}</span><b>${r.id}</b><span class="mu">${esc(r.area)}</span><span class="sp"></span><span class="tag ${r.st==='Applied'?'new':'mv'}">${r.st}</span><select data-a="rv" data-id="${r.id}" aria-label="Your decision on ${r.id}">${opts(RV,U.rv[r.id]||'Open')}</select></div><p class="fd"><b>${esc(r.f)}</b></p><p class="fd"><span class="mu">Why it matters.</span> ${esc(r.why)}</p><p class="fd" style="margin:0"><span class="mu">Recommendation.</span> ${esc(r.fix)}</p></div>`).join('')}`}
function vRef(){return `<h2>Architecture</h2><div class="card tw"><table><tr><th>Layer</th><th>Choice</th><th>Responsibility</th><th>Non-negotiable note</th></tr>${D.arch.map(a=>`<tr><td>${esc(a.l)}</td><td>${esc(a.c)}</td><td>${esc(a.r)}</td><td>${esc(a.n)}</td></tr>`).join('')}</table></div>
 <h2>Decisions</h2><div class="card tw"><table><tr><th>ID</th><th>Area</th><th>Choice</th><th>Reason</th><th>State</th></tr>${D.dec.map(d=>`<tr><td>${d.id}</td><td>${esc(d.a)}</td><td>${esc(d.c)}</td><td>${esc(d.r)}</td><td>${d.prop?`<select data-a="dc" data-id="${d.id}">${opts(['Proposed','Accepted','Rejected'],U.dc[d.id]||'Proposed')}</select>`:esc(d.s)}</td></tr>`).join('')}</table></div>
 <h2>Official documentation</h2><div class="card">${D.refs.map(r=>`<p class="fd"><a href="${esc(r.u)}" target="_blank" rel="noopener">${esc(r.n)}</a><br><span class="sm">${esc(r.w)}</span></p>`).join('')}</div>`}
function vSet(){return `<div class="two"><div><h2>Project</h2><div class="card"><label>Project start date<br><input type="date" data-a="start" value="${esc(U.start)}"></label><p class="sm">Used for the pace forecast on the Dashboard.</p></div>
 <h2>How it works</h2><div class="card sm"><p style="margin-top:0">Change task, screen and QA status in place. Done dates fill in automatically. The Revised plan includes the ${D.tasks.filter(t=>t.new).length} added tasks and re-sequenced weeks; Original plan shows your spreadsheet as it was. Progress is shared by both views.</p><p style="margin-bottom:0">Progress is saved in this browser and, when you are signed in, to your account. Export a backup now and then.</p></div></div>
 <div><h2>Backup</h2><div class="card"><button class="btn pri" data-a="exp">Export progress</button> <button class="btn" data-a="imp">Import from box</button> <button class="btn" data-a="rst">Reset progress</button><textarea id="io" aria-label="Progress JSON" placeholder="Exported JSON appears here if the file save is unavailable. Paste JSON here to import."></textarea></div></div></div>`}
const V={dash:vDash,tasks:vTasks,road:vRoad,screens:vScreens,qa:vQA,review:vReview,ref:vRef,set:vSet};
function render(){$('#nav').innerHTML=TABS.map(t=>`<button role="tab" aria-selected="${t[0]===view}" data-a="tab" data-v="${t[0]}">${t[1]}</button>`).join('');
 document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===U.plan));$('#m').innerHTML=V[view]()}
const setK=(k,v)=>{const[a,b]=k.split('.');F[a][b]=v;if(a==='tk')F.tk.pg=0};
document.addEventListener('click',async e=>{const b=e.target.closest('button[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v,id=b.dataset.id;
 if(a==='tab'){view=v;render();scrollTo(0,0)}else if(a==='plan'){U.plan=v;save();render()}else if(a==='goph'){F.tk.p=v;view='tasks';render()}
 else if(a==='tg'){open.has(id)?open.delete(id):open.add(id);$('#tl').innerHTML=tlist()}else if(a==='pg'){F.tk.pg+=+v;$('#tl').innerHTML=tlist();scrollTo(0,0)}
 else if(a==='exp'){const j=JSON.stringify(U,null,1);try{const d=await claude.use('downloads');if(d){await d.save({filename:'pace-progress.json',data:j});return}}catch(x){}$('#io').value=j}
 else if(a==='imp'){try{U={...U,...JSON.parse($('#io').value)};save();render()}catch(x){alert('That text is not valid exported progress.')}}
 else if(a==='rst'&&confirm('Reset all progress and notes? This cannot be undone.')){U={t:{},sc:{},qa:{},rv:{},dc:{},gate:{},start:'',plan:U.plan};save();render()}});
document.addEventListener('change',e=>{const t=e.target,a=t.dataset.a,id=t.dataset.id;if(!a)return;
 if(a==='f'){setK(t.dataset.k,t.type==='checkbox'?t.checked:t.value);render()}else if(a==='ts'){status(id,t.value);render()}
 else if(a==='ss'){U.sc[id]=t.value;save();render()}else if(a==='qr'){(U.qa[id]=U.qa[id]||{}).r=t.value;save();render()}else if(a==='rv'){U.rv[id]=t.value;save()}else if(a==='dc'){U.dc[id]=t.value;save()}
 else if(a==='gate'){U.gate[id]=t.checked;save()}else if(a==='start'){U.start=t.value;save()}else if(a==='tsd')setT(id,'sd',t.value);else if(a==='tcd')setT(id,'cd',t.value)});
document.addEventListener('input',e=>{const t=e.target,a=t.dataset.a,id=t.dataset.id;if(!a)return;
 if(a==='q'){const k=t.dataset.k;F[k].q=t.value;if(k==='tk')F.tk.pg=0;$('#'+({tk:'tl',sc:'sl',qa:'ql'})[k]).innerHTML=({tk:tlist,sc:slist,qa:qlist})[k]()}
 else if(a==='to')setT(id,'o',t.value);else if(a==='tn')setT(id,'n',t.value);else if(a==='qd'||a==='qe'){(U.qa[id]=U.qa[id]||{})[a==='qd'?'d':'e']=t.value;save()}});
load();
</script>
</body>
